AqBBwbY5a99o+zOnzeE89Z5dzhv9hRYUAoUKAUCFAqBAgVAgQKgQIFQLMUb+bnhNOz/dOPadyz+2uW/PVU6yoECBUCBAqBAgVAoQKAUKFAKFCwLU56q39nNOm9yWeur/0tX2ep/bBflVWVAgQKgQIFQKECgFChQChQoBQIeDb5/M58qDKXKt+Pu3KrXnprlP/rlvPv8WKCgFChQChQoBQIUCoECBUCBAqBBybowJzrKgQIFQIECoECBUChAoBQoUAoUKAUCFAqBAgVAgQKgQIFQKECgFChQChQoBQIUCoECBUCBAqBAgVAoQKAUKFAKFCwN8DKvMtO5hblgAAAABJRU5ErkJggg==';let showQR=false;const KEY='charity_quest_demo_v1';const TASKS=[{name:'需求觀察站',emoji:'🔎',title:'誰需要我們先協助？',story:'團隊收到三則求助訊息，請先選出最需要優先聯絡與評估的情況。',choices:['活動照片還沒整理好','獨居長者家中已無足夠餐食','倉庫裝飾需要更新'],correct:1,explain:'先評估迫切的基本生活需求，仍應依協會實際服務流程確認資訊。'},{name:'物資整理站',emoji:'📦',title:'食品箱怎麼整理比較好？',story:'準備寄送常溫食品，請大家討論最適合的檢查方法。',choices:['只看外箱顏色','確認品項、數量、包裝與效期','重量差不多就直接寄出'],correct:1,explain:'品項、數量、完整性與效期都要確認，避免物資不適合使用。'},{name:'合作配送站',emoji:'🚚',title:'配送出現臨時狀況！',story:'配送前發現一箱物資數量與清單不一致，團隊要怎麼做？',choices:['先記錄差異並告知負責幹部','直接修改紀錄讓數字相同','先忽略，等結束再說'],correct:0,explain:'回報異常並留下記錄，讓團隊一起處理，避免錯誤流入後續作業。'},{name:'關懷溝通站',emoji:'💬',title:'如何尊重受助家庭？',story:'服務過程遇到家庭不願公開個人情況，志工該如何回應？',choices:['分享照片讓更多人了解','尊重意願並保護個人資訊','要求對方配合公開'],correct:1,explain:'尊重、保密與當事人的自主意願，是服務關係的重要基礎。'}];
const TEAM_NAMES=['暖陽隊','同心隊','希望隊','星光隊'];const teamCapacity=i=>Math.floor(state.maxPlayers/state.teamCount)+(i<state.maxPlayers%state.teamCount?1:0);const buildTeams=n=>TEAM_NAMES.slice(0,n).map((name,i)=>({id:'t'+(i+1),name,members:[],score:0,answer:null}));const gen=()=>({maxPlayers:20,teamCount:4,code:String(Math.floor(1000+Math.random()*9000)),status:'lobby',stage:0,teams:buildTeams(4),logs:[],createdAt:Date.now()});let state;try{state=JSON.parse(localStorage.getItem(KEY))||gen()}catch{state=gen()}state.maxPlayers=state.maxPlayers||20;state.teamCount=state.teamCount||state.teams.length;let mode=new URLSearchParams(location.search).get('view')||'home';let profile=JSON.parse(sessionStorage.getItem('charity_quest_player')||'null');let error='';const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));try{new BroadcastChannel('charity_quest').postMessage('changed')}catch{}};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const link=(v)=>location.origin+location.pathname+'?view='+v;const app=document.getElementById('app');const nav=(v)=>{mode=v;history.replaceState({},'', '?view='+v);render()};const count=()=>state.teams.reduce((a,t)=>a+t.members.length,0);function base(body){app.innerHTML=`<main class="shell ${mode==='display'?'display':''}"><div class="top"><div class="logo"><div class="mark">❤</div><div><h2 style="margin:0">愛心任務島</h2><div class="muted tiny">協會參訪・合作闖關體驗</div></div></div><div class="btnrow"><button class="secondary" onclick="nav('home')">首頁</button>${mode!=='home'?`<span class="badge">房間 ${esc(state.code)}</span>`:''}</div></div>${body}<div class="footer">體驗版：不同分頁可在同一瀏覽器同步；跨手機即時連線需另外接雲端服務。</div></main>${showQR?`<div class="qr-overlay" role="dialog" aria-modal="true" aria-label="掃碼加入遊戲"><div class="qr-card"><div class="btnrow" style="justify-content:space-between"><b>📱 掃描加入隊伍</b><button class="secondary" onclick="toggleQR()">✕ 關閉</button></div><p class="muted">用手機相機掃描 QR Code，輸入暱稱、選擇隊伍即可進入。</p><img src="${QR_DATA}" alt="加入玩家頁面的 QR Code"/><p class="qr-url">${esc(QR_PLAYER_URL)}</p><p class="tiny muted">QR Code 指向目前 GitHub Pages 的玩家網址。若網址改變，需重新產生 QR Code。</p><button class="primary" onclick="toggleQR()">完成</button></div></div>`:""}`}
function toggleQR(){showQR=!showQR;render()}function home(){base(`<div class="hero"><span class="badge">可自訂 2–20 人・2–4 隊・4 道合作關卡</span><h1>一起完成，把愛送到需要的地方！</h1><p>用手機分組討論、闖過四個協會服務情境。不是比誰手快，而是一起觀察、溝通、做出最適合的決定。</p></div><h2 class="sectiontitle spaced">選擇你的入口</h2><div class="grid"><button class="role" onclick="nav('player')"><div class="emoji">📱</div><strong>參訪者手機</strong><div class="muted">輸入暱稱、加入隊伍、討論後由隊伍提交答案</div></button><button class="role" onclick="nav('display')"><div class="emoji">📺</div><strong>主持人大螢幕</strong><div class="muted">顯示目前關卡、隊伍進度、比分及揭曉結果</div></button><button class="role" onclick="nav('admin')"><div class="emoji">🎛️</div><strong>管理者後台</strong><div class="muted">重設房間、開始關卡、揭曉答案、前進下一關</div></button></div><div class="panel spaced"><b>遊戲流程</b><div class="steps"><span>① 掃碼 / 進入網址</span><span>② 主持人設定總人數與 2–4 隊</span><span>③ 團隊討論作答</span><span>④ 主持人揭曉</span><span>⑤ 公布合作成果</span></div><div class="notice">目前已提供玩家頁 QR Code，但仍屬同一瀏覽器示範；跨手機即時加入與分數同步需要接上即時資料庫。</div></div>`)}
function player(){if(!profile){base(`<div class="panel wide"><h2 class="sectiontitle">📱 參訪者加入遊戲</h2><p class="muted">預設房間：<b>${esc(state.code)}</b>。請選一隊加入，各隊名額依主持人設定的人數平均分配。</p><label>你的暱稱</label><input id="nick" class="input" maxlength="16" placeholder="例如：小美"/><label>選擇隊伍</label><div class="grid">${state.teams.map(t=>`<button class="team" onclick="join('${t.id}')"><strong>${esc(t.name)}</strong><div class="tiny muted">${t.members.length}/${teamCapacity(state.teams.indexOf(t))} 人</div></button>`).join('')}</div>${error?`<div class="notice error spaced">${esc(error)}</div>`:''}</div>`);return}const team=state.teams.find(t=>t.id===profile.teamId);if(!team||!team.members.some(m=>m.id===profile.id)){profile=null;sessionStorage.removeItem('charity_quest_player');return player()}const task=TASKS[state.stage];let content='';if(state.status==='lobby')content=`<div class="panel"><h2>👋 歡迎加入，${esc(profile.name)}！</h2><p>你是 <b>${esc(team.name)}</b> 的成員。和隊友一起討論，等待主持人開始。</p><div class="notice">加入成功！隊伍共 ${team.members.length} 人。</div></div>`;else if(state.status==='finished')content=`<div class="panel"><h2>🎉 合作任務完成！</h2><p>${esc(team.name)}：<b class="score">${team.score} 分</b></p><p>感謝一起體驗協會如何透過團隊合作完成服務！</p></div>`;else {let locked=team.answer!==null;content=`<div class="panel"><span class="badge">第 ${state.stage+1} / ${TASKS.length} 關 · ${esc(task.name)}</span><h2 class="sectiontitle spaced">${task.emoji} ${esc(task.title)}</h2><p>${esc(task.story)}</p><div class="task"><b>請和隊友討論，選出最合適的做法：</b><div class="choices">${task.choices.map((c,i)=>`<button class="choice ${locked&&team.answer===i?'chosen':''}" ${locked||state.status==='reveal'?'disabled':''} onclick="answer(${i})">${esc(c)}</button>`).join('')}</div></div>${locked?`<div class="notice success spaced">✅ ${esc(team.name)} 已提交答案，等待主持人揭曉。</div>`:''}${state.status==='reveal'?`<div class="notice spaced"><b>正解：${esc(task.choices[task.correct])}</b><p>${esc(task.explain)}</p></div>`:''}<p class="tiny muted spaced">同隊任何成員都能代表隊伍送出一個答案。送出後暫不允許修改。</p></div>`}base(`<div class="wide"><div class="panel"><div class="btnrow" style="justify-content:space-between"><div><b>${esc(profile.name)}</b><div class="tiny muted">${esc(team.name)} · ${team.members.length} 位隊員</div></div><button class="secondary" onclick="leave()">離開隊伍</button></div></div>${content}</div>`)}
function join(id){let name=document.getElementById('nick').value.trim(),team=state.teams.find(t=>t.id===id);if(!name){error='請先輸入暱稱';return render()}if(state.status!=='lobby'){error='遊戲已開始，請請主持人下一場重新加入';return render()}if(count()>=state.maxPlayers||team.members.length>=teamCapacity(state.teams.indexOf(team))){error='人數已額滿';return render()}profile={id:(crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())),name,teamId:id};team.members.push({id:profile.id,name});sessionStorage.setItem('charity_quest_player',JSON.stringify(profile));error='';save();render()}
function leave(){if(!confirm('確定離開隊伍？'))return;let t=state.teams.find(t=>t.id===profile.teamId);if(t)t.members=t.members.filter(m=>m.id!==profile.id);profile=null;sessionStorage.removeItem('charity_quest_player');save();render()}
function answer(i){if(!profile||state.status!=='playing')return;let t=state.teams.find(t=>t.id===profile.teamId);if(t&&t.answer===null){t.answer=i;save();render()}}
function display(){const t=TASKS[state.stage];const ranks=[...state.teams].sort((a,b)=>b.score-a.score);base(`<div class="panel"><div class="btnrow" style="justify-content:space-between"><span class="badge">${state.status==='lobby'?'等待加入':state.status==='playing'?'闖關進行中':state.status==='reveal'?'關卡答案揭曉':'全部完成'}</span><div class="btnrow"><button class="primary" onclick="toggleQR()">▦ 顯示 QR Code</button><button class="secondary" onclick="copyLink()">複製玩家網址</button></div></div><h1 class="stage">${state.status==='lobby'?'集合！愛心任務即將開始':state.status==='finished'?'🎉 闖關完成！':`${t.emoji} 第 ${state.stage+1} 關｜${esc(t.name)}`}</h1>${state.status==='lobby'?`<p style="font-size:22px">請參訪者掃描 QR Code，輸入暱稱並選擇隊伍。</p><p><b>房間代碼：${esc(state.code)}</b></p><p style="overflow-wrap:anywhere">${esc(link('player'))}</p>`:state.status==='finished'?'<p>每個人的投入，都是合作的一部分。</p>':`<p style="font-size:clamp(19px,3vw,30px)">${esc(t.title)}</p><p>${esc(t.story)}</p>${state.status==='reveal'?`<div class="notice success"><b>正解：${esc(t.choices[t.correct])}</b><p>${esc(t.explain)}</p></div>`:''}`}<div class="steps">${TASKS.map((s,i)=>`<span class="${i===state.stage&&state.status!=='lobby'?'on':''}">${i+1}. ${esc(s.name)}</span>`).join('')}</div></div><div class="grid">${ranks.map((x,i)=>`<div class="panel"><div class="btnrow" style="justify-content:space-between"><h2 style="margin:0">${esc(x.name)}</h2><span class="badge">${x.members.length} 人</span></div><div class="score">${x.score} <small style="font-size:14px">分</small></div><p class="muted tiny">${state.status==='playing'?(x.answer===null?'討論中':'✅ 已作答'):state.status==='reveal'?(x.answer===null?'未作答':x.answer===t.correct?'答對了！':'繼續加油'):''}</p></div>`).join('')}</div><p class="muted tiny">目前加入人數：${count()} / ${state.maxPlayers}；共 ${state.teamCount} 隊</p>`)}
function admin(){const t=TASKS[state.stage];base(`<div class="panel"><div class="btnrow" style="justify-content:space-between"><div><h2 class="sectiontitle">🎛️ 主持人控制台</h2><p class="muted">房間 ${esc(state.code)} · ${count()}/${state.maxPlayers} 位玩家 · ${state.teamCount} 隊 · 狀態：${esc(state.status)}</p></div><button class="danger" onclick="resetGame()">重設整場遊戲</button></div>${state.status==='lobby'?`<div class="task"><h3>開場設定｜先決定人數與隊伍</h3><p class="muted tiny">最多 20 人，選擇 2、3 或 4 隊；系統自動平均分配各隊名額。已有人加入後請先重設房間才能更改。</p><div class="grid"><div><label for="maxPlayers">預計參加人數</label><select id="maxPlayers" class="input" onchange="updateSetup()" ${count()>0?'disabled':''}>${Array.from({length:19},(_,i)=>i+2).map(n=>`<option value="${n}" ${state.maxPlayers===n?'selected':''}>${n} 人</option>`).join('')}</select></div><div><label for="teamCount">分組數量</label><select id="teamCount" class="input" onchange="updateSetup()" ${count()>0?'disabled':''}>${[2,3,4].filter(n=>n<=state.maxPlayers).map(n=>`<option value="${n}" ${state.teamCount===n?'selected':''}>${n} 組</option>`).join('')}</select></div></div><p class="tiny">${state.teams.map((x,i)=>`${esc(x.name)}：最多 ${teamCapacity(i)} 人`).join('　｜　')}</p></div>`:''}<div class="steps">${TASKS.map((x,i)=>`<span class="${state.stage===i&&state.status!=='lobby'?'on':''}">${i+1}. ${esc(x.name)}</span>`).join('')}</div><div class="btnrow spaced">${state.status==='lobby'?'<button class="primary" onclick="start()">▶ 開始第一關</button>':''}${state.status==='playing'?'<button class="accent" onclick="reveal()">👀 揭曉答案並計分</button>':''}${state.status==='reveal'?`<button class="primary" onclick="next()">${state.stage===TASKS.length-1?'🏁 完成遊戲':'➡ 前往下一關'}</button>`:''}<button class="secondary" onclick="nav('display')">開啟大螢幕畫面</button></div><div class="notice spaced">操作建議：主持人開一個「管理後台」分頁，再開一個「大螢幕」分頁投影。現階段只適合同一瀏覽器的示範，不適合直接讓 20 支手機跨裝置遊玩。</div></div><div class="grid">${state.teams.map(x=>`<div class="panel"><div class="btnrow" style="justify-content:space-between"><b>${esc(x.name)}</b><span class="badge">${x.members.length}/${teamCapacity(state.teams.indexOf(x))} 人</span></div><p class="score">${x.score} 分</p><div class="muted tiny">${x.members.map(m=>esc(m.name)).join('、')||'尚無隊員'}</div><p class="tiny">${x.answer===null?'尚未作答':state.status==='playing'?'已送出答案':`作答：${esc(t.choices[x.answer])}`}</p></div>`).join('')}</div>`)}
function updateSetup(){if(state.status!=='lobby'||count()>0)return;const players=Number(document.getElementById('maxPlayers').value);let groups=Number(document.getElementById('teamCount').value);if(!Number.isInteger(players)||players<2||players>20)return;groups=Math.max(2,Math.min(groups,players,4));state.maxPlayers=players;state.teamCount=groups;state.teams=buildTeams(groups);save();render()}function start(){if(state.status!=='lobby')return;state.status='playing';save();render()}function reveal(){if(state.status!=='playing')return;for(const t of state.teams){if(t.answer===TASKS[state.stage].correct)t.score+=100}state.status='reveal';save();render()}function next(){if(state.status!=='reveal')return;if(state.stage>=TASKS.length-1){state.status='finished'}else{state.stage++;state.status='playing';state.teams.forEach(x=>x.answer=null)}save();render()}function resetGame(){if(!confirm('確定清空所有隊伍與分數，開始新房間？'))return;state=gen();profile=null;sessionStorage.removeItem('charity_quest_player');save();render()}async function copyLink(){try{await navigator.clipboard.writeText(link('player'));alert('已複製網址')}catch{prompt('請複製網址',link('player'))}}function render(){if(mode==='player')player();else if(mode==='display')display();else if(mode==='admin')admin();else home()};window.addEventListener('storage',e=>{if(e.key===KEY){try{state=JSON.parse(e.newValue)}catch{}render()}});try{const bc=new BroadcastChannel('charity_quest');bc.onmessage=()=>{try{state=JSON.parse(localStorage.getItem(KEY))||state}catch{}render()}}catch{}render();
</script></body></html>
